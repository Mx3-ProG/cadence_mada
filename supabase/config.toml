project_id = "ecdpfhacuwrfihyulqzf"

[auth]
site_url = "https://www.cadencemada.com"
additional_redirect_urls = [
  "https://www.cadencemada.com/**",
  "https://cadencemada.com/**",
  "https://cadencemada.vercel.app/**",
  "http://localhost:5173/**"
]

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_OAUTH_CLIENT_ID)"
secret = "env(GOOGLE_OAUTH_CLIENT_SECRET)"
skip_nonce_check = false

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_API_KEY)"
admin_email = "rdv@cadencemada.com"
sender_name = "Cadence Mada"

[auth.email.template.confirmation]
subject = "Confirmez votre adresse email — Cadence Mada"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "Vous êtes invité(e) sur Cadence Mada"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Votre lien de connexion — Cadence Mada"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.email_change]
subject = "Confirmez votre nouvelle adresse email — Cadence Mada"
content_path = "./supabase/templates/email-change.html"

[auth.email.template.recovery]
subject = "Réinitialisez votre mot de passe — Cadence Mada"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.reauthentication]
subject = "{{ .Token }} est votre code de vérification Cadence Mada"
content_path = "./supabase/templates/reauthentication.html"

[functions.send-reminders]
verify_jwt = false
