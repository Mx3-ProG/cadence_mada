<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cadence, l'agenda qui se confirme tout seul</title>
  <desc id="desc">Carte de partage de l'application Cadence</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(970 88) rotate(132) scale(560 450)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#49d7a3" stop-opacity=".26"/>
      <stop offset="1" stop-color="#49d7a3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#dff7ed" stroke-opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#061a15" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="#102b26"/>
  <rect width="1200" height="630" rx="32" fill="url(#grid)"/>
  <rect width="1200" height="630" rx="32" fill="url(#glow)"/>

  <g transform="translate(78 68)">
    <rect width="72" height="72" rx="20" fill="#153d34" stroke="#49d7a3" stroke-opacity=".35"/>
    <path d="M45.5 18.5a21 21 0 1 0 .5 35" fill="none" stroke="#49d7a3" stroke-width="7.5" stroke-linecap="round"/>
    <path d="m35 38.5 7 7 14-17" fill="none" stroke="#f7fbf8" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="92" y="51" fill="#f7fbf8" font-family="Sora, Avenir Next, sans-serif" font-size="42" font-weight="750" letter-spacing="-1.6">Cadence</text>
  </g>

  <text x="78" y="264" fill="#f7fbf8" font-family="Sora, Avenir Next, sans-serif" font-size="64" font-weight="750" letter-spacing="-2.4">Un rendez-vous.</text>
  <text x="78" y="338" fill="#49d7a3" font-family="Sora, Avenir Next, sans-serif" font-size="64" font-weight="750" letter-spacing="-2.4">Confirmé sans relance.</text>
  <text x="82" y="400" fill="#b7ccc5" font-family="Manrope, Avenir Next, sans-serif" font-size="25" font-weight="500">Crée le créneau, partage le lien, suis la réponse.</text>

  <g transform="translate(78 478)" font-family="Manrope, Avenir Next, sans-serif" font-size="18" font-weight="650">
    <g>
      <rect width="174" height="48" rx="24" fill="#f7fbf8" fill-opacity=".07" stroke="#f7fbf8" stroke-opacity=".1"/>
      <circle cx="27" cy="24" r="7" fill="#49d7a3"/>
      <text x="46" y="31" fill="#eaf5f1">Agenda fluide</text>
    </g>
    <g transform="translate(188)">
      <rect width="192" height="48" rx="24" fill="#f7fbf8" fill-opacity=".07" stroke="#f7fbf8" stroke-opacity=".1"/>
      <path d="m22 24 5 5 10-12" fill="none" stroke="#49d7a3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="31" fill="#eaf5f1">Réponse en direct</text>
    </g>
  </g>

  <g transform="translate(872 188) rotate(5)" filter="url(#shadow)">
    <rect width="254" height="286" rx="32" fill="#f7fbf8"/>
    <rect x="24" y="24" width="206" height="42" rx="14" fill="#e7f1ed"/>
    <circle cx="49" cy="45" r="8" fill="#49d7a3"/>
    <rect x="68" y="38" width="87" height="8" rx="4" fill="#315f53"/>
    <rect x="68" y="51" width="55" height="5" rx="2.5" fill="#8aa69e"/>
    <text x="28" y="111" fill="#12352e" font-family="Sora, Avenir Next, sans-serif" font-size="17" font-weight="750">Aujourd'hui</text>
    <g transform="translate(24 130)">
      <rect width="206" height="68" rx="16" fill="#edf6f2"/>
      <text x="16" y="27" fill="#12352e" font-family="Sora, Avenir Next, sans-serif" font-size="14" font-weight="700">14:30 · Démo produit</text>
      <circle cx="22" cy="48" r="6" fill="#49d7a3"/>
      <text x="35" y="53" fill="#48776b" font-family="Manrope, Avenir Next, sans-serif" font-size="12" font-weight="650">Confirmé</text>
    </g>
    <g transform="translate(24 212)">
      <rect width="206" height="48" rx="16" fill="#12352e"/>
      <path d="m22 24 5 5 10-12" fill="none" stroke="#49d7a3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="30" fill="#f7fbf8" font-family="Manrope, Avenir Next, sans-serif" font-size="13" font-weight="700">Rendez-vous confirmé</text>
    </g>
  </g>
</svg>
